<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevShop</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" data-action="back" aria-label="Назад">‹</button>
      <div class="logo">
        <span class="logo-badge">🛍</span>
        <span id="title">DevShop</span>
      </div>
      <button id="cartBadge" class="cart-badge hidden" data-action="nav-cart" aria-label="Корзина">
        🛒 <span id="cartCount">0</span>
      </button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-nav="catalog"><span class="ni-ico">🛍</span><span>Каталог</span></button>
      <button class="nav-item" data-nav="cart"><span class="ni-ico">🛒</span><span>Корзина</span><span class="nav-badge hidden" id="navCartCount">0</span></button>
      <button class="nav-item" data-nav="orders"><span class="ni-ico">📦</span><span>Заказы</span></button>
      <button class="nav-item hidden" data-nav="admin" id="adminNav"><span class="ni-ico">⚙️</span><span>Админ</span></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
