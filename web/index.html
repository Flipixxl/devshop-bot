<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevShop</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" data-action="back" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="logo">
        <span class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 12H7.2L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        </span>
        <span id="title">DevShop</span>
      </div>
      <button id="cartBadge" class="cart-badge hidden" data-action="nav-cart" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 12H7.2L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span id="cartCount">0</span>
      </button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-nav="catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
        <span>Каталог</span>
      </button>
      <button class="nav-item" data-nav="cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 12H7.2L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span>Корзина</span>
        <span class="nav-badge hidden" id="navCartCount">0</span>
      </button>
      <button class="nav-item" data-nav="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v10l-8 4-8-4V7l8-4z"/><path d="M12 3v10"/><path d="M20 7l-8 4-8-4"/></svg>
        <span>Заказы</span>
      </button>
      <button class="nav-item hidden" data-nav="admin" id="adminNav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--bg)"/><circle cx="15" cy="12" r="2" fill="var(--bg)"/><circle cx="9" cy="17" r="2" fill="var(--bg)"/></svg>
        <span>Админ</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
